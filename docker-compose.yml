version: '3.8'

services:
  zjz-ai-agent:
    build: .
    container_name: zjz-ai-agent
    ports:
      - "8081:8081"
    environment:
      # 从 .env 文件自动读取变量
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      # chat=openai（DeepSeek 兼容接口），embedding=dashscope，选型见 application-prod.yml
      - SPRING_AI_OPENAI_API_KEY=${SPRING_AI_OPENAI_API_KEY}
      - SPRING_AI_OPENAI_BASE_URL=${SPRING_AI_OPENAI_BASE_URL}
      - SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL=${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - SPRING_AI_DASHSCOPE_EMBEDDING_TIMEOUT=${SPRING_AI_DASHSCOPE_EMBEDDING_TIMEOUT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      # 覆盖 application-prod.yml 里写死的 465，走 587 + STARTTLS
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - PG_HOST=${PG_HOST}
      - PG_PORT=${PG_PORT}
      - PG_USERNAME=${PG_USERNAME}
      - PG_PASSWORD=${PG_PASSWORD}
      # Tavily 搜索 Key（必须 tvly- 开头）
      - SEARCH_API_KEY=${SEARCH_API_KEY}
      - SERVER_PORT=${SERVER_PORT}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED}
      - KNIFE4J_ENABLED=${KNIFE4J_ENABLED}
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
